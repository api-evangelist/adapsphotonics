aid: adapsphotonics
name: Adaps Photonics
description: 'Adaps Photonics (Shenzhen Adaps Photonics Technology Co., Ltd. / 灵明光子)
  is a fabless semiconductor company founded in May 2018 in the Nanshan district of
  Shenzhen, China, with R&D centers in Shanghai and Zhejiang. It designs single-photon
  avalanche diode (SPAD) based direct time-of-flight (dToF) 3D depth-sensing chips and
  modules — silicon photomultipliers (SiPM), 3D-stacked SPAD arrays hybrid-bonded to
  custom DSP dies, and all-in-one integrated dToF depth sensors — for smartphones,
  automotive LiDAR, AR/VR headsets, robotics, smart home and industrial IoT. The
  company sells silicon and sensor modules to device makers through a direct sales
  motion; it publishes no public API, SDK, developer portal or machine-readable
  interface contract.'
